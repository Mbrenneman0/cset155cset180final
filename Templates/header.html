<header>
    <span id="logo">
        <a href="{{ url_for('index.index') }}"><img src="{{ url_for('static', filename='images/TradeHive_Logo.png') }}" alt=""></a>
    </span>
    
    <div class="searchbar">
        <form action="{{ url_for('index.index') }}" method="GET" class="search_form">
            <input
                type="text"
                name="q"
                placeholder="Search"
                value="{{ search_query|default('') }}"
            >
        
            {% if selected_category|default('') %}
                <input type="hidden" name="category" value="{{ selected_category }}">
            {% endif %}
        
            <button type="submit">Search</button>
        </form>
    </div>
    <div class="navlinks">
    <div class="navlink cart">
        <a href="{{ url_for('cart.view_cart') }}">Cart <ion-icon name="cart-outline"></ion-icon></a>
    </div>
    <div class="navlink account">
        <a href="{{ url_for('dashboard.dashboard') }}"><ion-icon name="person-outline" class="acct-icn"></ion-icon></a>
    </div>
    </div>
</header>
